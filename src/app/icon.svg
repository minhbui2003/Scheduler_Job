<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded app icon tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glass glow border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Calendar Body -->
  <g filter="url(#glow)">
    <!-- Binder Rings -->
    <rect x="21" y="11" width="4" height="6" rx="2" fill="#FFFFFF" />
    <rect x="39" y="11" width="4" height="6" rx="2" fill="#FFFFFF" />

    <!-- Calendar Card Base -->
    <rect x="13" y="14" width="38" height="37" rx="8" fill="#FFFFFF" fill-opacity="0.96" />

    <!-- Top Header Stripe -->
    <path d="M13 22C13 17.5817 16.5817 14 21 14H43C47.4183 14 51 17.5817 51 22V24H13V22Z" fill="#4F46E5" />

    <!-- Mini Calendar Grid Days -->
    <circle cx="21" cy="30" r="2.2" fill="#6366F1" />
    <circle cx="28" cy="30" r="2.2" fill="#6366F1" />
    <circle cx="35" cy="30" r="2.2" fill="#6366F1" />
    <circle cx="42" cy="30" r="2.2" fill="#6366F1" />

    <circle cx="21" cy="37" r="2.2" fill="#6366F1" />
    <circle cx="28" cy="37" r="2.2" fill="#6366F1" />
    <circle cx="35" cy="37" r="2.2" fill="#CBD5E1" />

    <circle cx="21" cy="44" r="2.2" fill="#CBD5E1" />
    <circle cx="28" cy="44" r="2.2" fill="#CBD5E1" />

    <!-- Active Interview Scheduled Badge -->
    <circle cx="40.5" cy="41.5" r="7.5" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="2" />
    <path d="M37.5 41.5L39.5 43.5L43.5 39.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
